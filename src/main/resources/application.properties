spring.application.name=RegisterLogin
spring.datasource.url=jdbc:postgresql://localhost:5432/docflow
spring.datasource.username=docflow_user
spring.datasource.password=docflow_pass
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
aws.s3.endpoint=http://localhost:4566
aws.s3.bucket=docflow-files
aws.s3.access-key=${AWS_ACCESS_KEY:test}
aws.s3.secret-key=${AWS_SECRET_KEY:test}